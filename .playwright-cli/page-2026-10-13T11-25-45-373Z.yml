        - region "Apakah data saya aman?":
          - paragraph [ref=f8e165]: Kami hanya meminta data yang diperlukan untuk transaksi (nomor tujuan) dan tidak membagikannya ke pihak lain di luar proses transaksi.
      - generic [ref=f8e166]:
        - button "Apakah saya perlu membuat akun?" [ref=f8e167] [cursor=pointer]
        - region "Apakah saya perlu membuat akun?":
