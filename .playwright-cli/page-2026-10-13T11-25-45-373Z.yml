        - button "Bagaimana cara membeli pulsa atau token PLN?" [ref=f8e108] [cursor=pointer]
        - region "Bagaimana cara membeli pulsa atau token PLN?":
          - paragraph [ref=f8e111]: Pilih kategori (Pulsa atau Token PLN), pilih nominal, lalu klik Beli. Masukkan nomor HP atau nomor meter/ID pelanggan, periksa total harga termasuk biaya admin, lalu lanjutkan pembayaran. Pulsa atau token dikirim otomatis setelah pembayaran diterima.
      - generic [ref=f8e112]:
        - button "Bagaimana cara cek status transaksi?" [ref=f8e113] [cursor=pointer]
        - region "Bagaimana cara cek status transaksi?":
          - paragraph [ref=f8e116]:
            - text: Buka halaman
            - link "Cek Transaksi" [ref=f8e117] [cursor=pointer]:
              - /url: /cek-transaksi
            - text: ", lalu masukkan ID transaksi (diawali AVD-) atau nomor tujuan. Status dan riwayat prosesnya akan tampil tanpa perlu login."
      - generic [ref=f8e118]:
        - button "Apakah transaksi bisa dilakukan 24 jam?" [ref=f8e119] [cursor=pointer]
        - region "Apakah transaksi bisa dilakukan 24 jam?":
          - paragraph [ref=f8e122]: Bisa. Sistem kami memproses transaksi secara otomatis 24/7. Pada jam pemeliharaan operator atau bank tertentu (biasanya dini hari), proses bisa sedikit lebih lama.
      - generic [ref=f8e123]:
        - button "Metode pembayaran apa saja yang tersedia?" [ref=f8e124] [cursor=pointer]
        - region "Metode pembayaran apa saja yang tersedia?":
          - paragraph [ref=f8e127]: QRIS, transfer bank / virtual account (BCA, Mandiri, BNI, BRI), serta e-wallet seperti GoPay, OVO, DANA, dan ShopeePay.
      - generic [ref=f8e128]:
        - button "Apakah ada biaya admin?" [ref=f8e129] [cursor=pointer]
        - region "Apakah ada biaya admin?":
          - paragraph [ref=f8e132]: Ada untuk sebagian produk, terutama pembayaran tagihan. Biaya admin selalu ditampilkan terpisah sebelum kamu membayar, jadi tidak ada biaya tersembunyi.
      - generic [ref=f8e133]:
        - button "Berapa lama proses refund?" [ref=f8e134] [cursor=pointer]
        - region "Berapa lama proses refund?":
          - paragraph [ref=f8e137]: Refund untuk transaksi gagal diproses otomatis maksimal 1×24 jam ke metode pembayaran asal. Waktu dana masuk ke rekening/e-wallet bisa bergantung pada bank atau penyedia e-wallet.
      - generic [ref=f8e138]:
        - button "Pulsa belum masuk, apa yang harus dilakukan?" [ref=f8e139] [cursor=pointer]
        - region "Pulsa belum masuk, apa yang harus dilakukan?":
          - paragraph [ref=f8e142]:
            - text: Cek dulu statusnya di
            - link "Cek Transaksi" [ref=f8e143] [cursor=pointer]:
              - /url: /cek-transaksi
            - text: . Jika status Diproses, tunggu hingga 15 menit karena operator kadang mengalami antrean. Jika lebih dari 1 jam atau status Gagal, hubungi CS dengan menyertakan ID transaksi.
      - generic [ref=f8e144]:
        - button "Token PLN belum diterima." [ref=f8e145] [cursor=pointer]
        - region "Token PLN belum diterima.":
          - paragraph [ref=f8e148]:
            - text: Nomor token tampil di halaman
            - link "Cek Transaksi" [ref=f8e149] [cursor=pointer]:
              - /url: /cek-transaksi
            - text: begitu status Berhasil, lengkap dengan tombol salin. Jika status berhasil tetapi token tidak tampil, hubungi CS dan sebutkan ID transaksi serta nomor meter.
      - generic [ref=f8e150]:
        - button "Salah input nomor tujuan, bisa dibatalkan?" [ref=f8e151] [cursor=pointer]
        - region "Salah input nomor tujuan, bisa dibatalkan?":
          - paragraph [ref=f8e154]: Transaksi yang sudah diproses ke operator tidak bisa dibatalkan karena dikirim otomatis. Jika status masih Menunggu Pembayaran, cukup jangan lanjutkan pembayaran. Untuk kasus lain, segera hubungi CS agar kami bantu cek.
      - generic [ref=f8e155]:
        - button "Bagaimana menghubungi CS?" [ref=f8e156] [cursor=pointer]
        - region "Bagaimana menghubungi CS?":
          - paragraph [ref=f8e159]:
            - text: Hubungi kami lewat WhatsApp atau email di bagian
            - link "Masih butuh bantuan?" [ref=f8e160] [cursor=pointer]:
